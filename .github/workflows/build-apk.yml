name: Build Captain Hima Gym APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'captain-hima-gym-apk-build-ready.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q captain-hima-gym-apk-build-ready.zip -d project

      - name: Build APK
        run: |
          gradle -p project --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Hima-Gym-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
