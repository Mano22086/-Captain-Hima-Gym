name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest ZIP project if present
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          else
            echo "No zip file found."
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and local.properties
        run: |
          touch .env
          SDK_DIR=$ANDROID_HOME
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Fix build.gradle.kts (remove missing debugConfig)
        run: |
          find . -name "build.gradle.kts" -exec sed -i '/debugConfig/d' {} +
          find . -name "build.gradle" -exec sed -i '/debugConfig/d' {} +

      - name: Make gradlew executable if present
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Locate and copy output APK to repository root
        run: |
          APK_PATH=$(find . -name "*.apk" ! -name "Captain-Hima-Gym*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" ./Captain-Hima-Gym-v2.apk
          cp "$APK_PATH" ./Captain-Hima-Gym.apk

      - name: Commit and push APK to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Captain-Hima-Gym-v2.apk Captain-Hima-Gym.apk || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated build: Update APK [skip ci]"
            git push origin main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Hima-Gym-v2-APK
          path: Captain-Hima-Gym-v2.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Release v2.0.${{ github.run_number }}
          body: "Automated Release for Captain Hima Gym v2 APK"
          files: Captain-Hima-Gym-v2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
