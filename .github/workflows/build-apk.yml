name: Build Gym APK



on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project & Prepare environment
        run: |
          mkdir -p project
          unzip -o captain-hima-gym-apk-build-ready.zip -d project
          touch project/.env
          echo "sdk.dir=$ANDROID_HOME" > project/local.properties
          find project -name "build.gradle*" -exec sed -i '/debugConfig/d' {} +
          find project -name "build.gradle*" -exec sed -i '/signingConfig signingConfigs.debug/d' {} +
          if [ -f project/gradlew ]; then
            chmod +x project/gradlew
          fi

      - name: Build APK
        run: |
          cd project
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Hima-Gym-APK
          path: project/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/*.apk
        env:
          G          ITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  work
