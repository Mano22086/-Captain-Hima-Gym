@Composable
fun rememberNetworkConnectedState(): State<Boolean> {
    val context = LocalContext.current
    return produceState(initialValue = isCurrentlyConnected(context)) {
        val connectivityManager = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
        val request = NetworkRequest.Builder()
            .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
            .build()
        val callback = object : ConnectivityManager.NetworkCallback() {
            override fun onAvailable(network: Network) { value = true }
            override fun onLost(network: Network) { value = isCurrentlyConnected(context) }
        }
        connectivityManager.registerNetworkCallback(request, callback)
        awaitDispose {
            connectivityManager.unregisterNetworkCallback(callback)
        }
    }
}

private fun isCurrentlyConnected(context: Context): Boolean {
    val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
    val act = cm.activeNetwork ?: return false
    val caps = cm.getNetworkCapabilities(act) ?: return false
    return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
}

