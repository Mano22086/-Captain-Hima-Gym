name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Unpack and Prepare Android Project
        run: |
          ZIP_FILE=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o -q "$ZIP_FILE"
          fi
          SETTINGS_DIR=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1 | xargs dirname)
          if [ -n "$SETTINGS_DIR" ] && [ "$SETTINGS_DIR" != "." ]; then
            cp -rn "$SETTINGS_DIR"/. .
          fi
          cp .env.example .env 2>/dev/null || true
          echo "SUPABASE_URL=https://placeholder.supabase.co" >> .env
          echo "SUPABASE_ANON_KEY=placeholder" >> .env
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i "/signingConfig = signingConfigs/d" app/build.gradle.kts 2>/dev/null || true
          sed -i "/signingConfig signingConfigs/d" app/build.gradle.kts 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Build Android APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Copy and Commit APK to Root
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK" ]; then
            mkdir -p release_out
            cp "$APK" release_out/Captain-Hima-Gym-v3-NEW.apk
            cp "$APK" Captain-Hima-Gym-v3-NEW.apk
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Captain-Hima-Gym-v3-NEW.apk
            git commit -m "Add Captain-Hima-Gym-v3-NEW.apk [skip ci]" || true
            git push origin main || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Hima-Gym-NEW-APK
          path: release_out/Captain-Hima-Gym-v3-NEW.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.0-NEW"
          name: "Captain Hima Gym APK v3.0 (النسخة الجديدة)"
          files: release_out/Captain-Hima-Gym-v3-NEW.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
