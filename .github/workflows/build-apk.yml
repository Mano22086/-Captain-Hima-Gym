name: Build Gym APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Extract project
        run: |
          mkdir project
          unzip -q captain-hima-gym-apk-build-ready.zip -d project
          chmod +x project/gradlew

      - name: Build APK
        run: |
          cd project
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gym-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
