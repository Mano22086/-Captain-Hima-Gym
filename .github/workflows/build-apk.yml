name: Build Captain Hima Gym APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'captain-hima-gym-apk-build-ready.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          mkdir project
          unzip -q captain-hima-gym-apk-build-ready.zip -d project

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Captain-Hima-Gym-APK
          path: project/app/build/outputs/apk/debug/*.apk
